[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor"
rustflags = [
  "-C", "link-arg=-nostartfiles",
]

# Default to the device target for plain `cargo build` / `make device`.
# Simulation builds override with `--target x86_64-unknown-linux-gnu`.
[build]
target = "xtensa-esp32s3-none-elf"
