[package]
name = "stickman"
version = "0.1.0"
edition = "2021"
authors = ["stickman"]
description = "Tamagotchi-like stick figure game for LilyGo T-Display-S3 AMOLED Touch"
license = "MIT OR Apache-2.0"
default-run = "stickman"

[features]
default = ["device"]
device = [
    "dep:esp-hal",
    "dep:esp-backtrace",
    "dep:esp-println",
    "dep:esp-alloc",
    "dep:esp-bootloader-esp-idf",
    "dep:t-display-s3-amoled",
    "dep:esp-rtos",
    "dep:esp-radio",
    "dep:esp-storage",
    "dep:embassy-executor",
    "dep:embassy-net",
    "dep:embassy-time",
    "dep:embassy-usb",
    "dep:embassy-sync",
    "dep:embassy-futures",
    "dep:static_cell",
    "dep:embedded-io-async",
    "dep:embedded-storage",
]
sim = ["dep:minifb", "dep:png"]

[dependencies]
embedded-graphics = "0.8"
embedded-hal = "1.0"
heapless = { version = "0.8", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
serde-json-core = { version = "0.6", default-features = false }

# Device (ESP32-S3) dependencies
esp-hal = { version = "1.0.0", optional = true, features = ["esp32s3", "unstable", "psram"] }
esp-backtrace = { version = "0.18.1", optional = true, features = [
    "esp32s3",
    "panic-handler",
    "println",
] }
esp-println = { version = "0.16.1", optional = true, default-features = false, features = ["esp32s3", "uart"] }
esp-alloc = { version = "0.9.0", optional = true, features = ["compat"] }
esp-bootloader-esp-idf = { version = "0.4.0", optional = true, features = ["esp32s3"] }
esp-rtos = { version = "0.2.0", optional = true, features = ["esp32s3", "esp-radio", "embassy"] }
esp-radio = { version = "0.17.0", optional = true, features = ["esp32s3", "wifi", "esp-alloc"] }
esp-storage = { version = "0.8", optional = true, features = ["esp32s3"] }
t-display-s3-amoled = { path = "vendor/t-display-s3-amoled", optional = true }

embassy-executor = { version = "0.9.0", optional = true }
embassy-net = { version = "0.7.0", optional = true, features = [
    "dhcpv4",
    "medium-ethernet",
    "tcp",
    "udp",
    "dns",
    "proto-ipv4",
] }
embassy-time = { version = "0.5.0", optional = true }
embassy-usb = { version = "0.5.0", optional = true, default-features = false }
embassy-sync = { version = "0.7.0", optional = true }
embassy-futures = { version = "0.1.1", optional = true }
static_cell = { version = "2.1.0", optional = true }
embedded-io-async = { version = "0.6.1", optional = true }
embedded-storage = { version = "0.3", optional = true }

# Desktop simulation
minifb = { version = "0.27", optional = true }
png = { version = "0.17", optional = true }

[profile.dev.package.esp-radio]
opt-level = 3

[[bin]]
name = "stickman"
path = "src/main.rs"
required-features = ["device"]

[[bin]]
name = "stickman-sim"
path = "src/bin/sim.rs"
required-features = ["sim"]
